name: publish-mcp
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  id-token: write
  contents: write
concurrency:
  group: mcp-publish-${{ github.repository }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      NAME: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Test publication guard
        run: python3 -m unittest discover -s tests -v
      - name: Verify existing registry version and release asset
        id: registry
        run: python3 scripts/registry_state.py
      - uses: actions/setup-node@v4
        if: steps.registry.outputs.publish_needed == 'true'
        with: { node-version: 20 }
      - run: npm install --omit=dev
        if: steps.registry.outputs.publish_needed == 'true'
      - run: npx -y @anthropic-ai/mcpb pack . "$NAME.mcpb"
        if: steps.registry.outputs.publish_needed == 'true'
      - name: release without overwriting immutable assets
        if: steps.registry.outputs.publish_needed == 'true'
        env:
          TAG: ${{ steps.registry.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$NAME.mcpb" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$NAME.mcpb" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes "MCPB bundle"
          fi
      - name: sha into server.json
        if: steps.registry.outputs.publish_needed == 'true'
        run: |
          SHA=$(sha256sum "$NAME.mcpb" | cut -d' ' -f1)
          jq --arg s "$SHA" '.packages[0].fileSha256=$s' server.json > s.tmp && mv s.tmp server.json
      - run: curl -fsSL https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz | tar xz mcp-publisher
        if: steps.registry.outputs.publish_needed == 'true'
      - run: ./mcp-publisher login github-oidc
        if: steps.registry.outputs.publish_needed == 'true'
      - run: ./mcp-publisher publish
        if: steps.registry.outputs.publish_needed == 'true'
      - name: Verify published manifest and actual release bytes
        if: steps.registry.outputs.publish_needed == 'true'
        run: python3 scripts/registry_state.py --require-published
